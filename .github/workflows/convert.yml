name: Daily Nodes Converter (with WARP)

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install requests pyyaml urllib3 cryptography
      - name: Setup WARP
        run: python scripts/warp_setup.py
      - name: Convert Nodes
        run: python scripts/convert.py
      - name: Generate README
        run: python scripts/gen_readme.py
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          git diff --staged --quiet || (
            git commit -m "Daily update $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          )