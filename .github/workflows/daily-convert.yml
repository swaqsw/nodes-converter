name: Daily Nodes Converter (with WARP)

on:
  schedule:
    # 每天北京时间早上 5 点 (UTC 21:00 the previous day)
    - cron: '0 21 * * *'
  workflow_dispatch:  # 手动触发
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  actions: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml urllib3 cryptography

      - name: Setup WARP
        run: |
          python scripts/warp_setup.py

      - name: Convert Nodes
        run: |
          python scripts/convert.py

      - name: Generate README Stats
        run: |
          python -c "
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          nodes = json.loads(Path('output/all_nodes.json').read_text())
          stats = {}
          for n in nodes:
              p = n.get('protocol', 'unknown')
              stats[p] = stats.get(p, 0) + 1

          now = (datetime.now(timezone.utc) + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M')
          warp_status = '✅' if Path('output/warp_config.json').exists() else '❌'

          lines = [
              f'# 🚀 Proxy Nodes Converter',
              f'',
              f'> 最后更新: {now} CST | WARP: {warp_status} | 每日 5:00 AM 自动运行',
              f'',
              f'## 📊 节点统计',
              f'',
              f'| 协议 | 数量 |',
              f'|------|------|',
          ]
          for p, c in sorted(stats.items()):
              lines.append(f'| {p} | {c} |')
          lines.append(f'| **总计** | **{len(nodes)}** |')
          lines.extend([
              f'',
              f'## 📦 输出文件',
              f'',
              f'| 文件 | 用途 |',
              f'|------|------|',
              f'| [share_links.txt](output/share_links.txt) | v2rayN / Nekoray 可直接导入的节点链接 |',
              f'| [subscription_b64.txt](output/subscription_b64.txt) | Base64 编码的订阅链接 |',
              f'| [clash_config.yaml](output/clash_config.yaml) | Clash Meta / Mihomo 完整配置 |',
              f'| [singbox_config.json](output/singbox_config.json) | sing-box 配置（含 WARP 出站） |',
              f'| [all_nodes.json](output/all_nodes.json) | 所有节点结构化数据 |',
              f'',
              f'## 🛡️ WARP 集成',
              f'',
              f'已自动集成 Cloudflare WARP 作为备用出站。',
              f'sing-box 配置中所有节点流量默认通过代理 → WARP 双层链路。',
              f'',
              f'## 🔧 本地使用',
              f'',
              f'```bash',
              f'pip install requests pyyaml urllib3 cryptography',
              f'python scripts/warp_setup.py   # 首次运行注册 WARP',
              f'python scripts/convert.py      # 拉取并转换',
              f'```',
              f'',
              f'## ⏰ 自动更新',
              f'',
              f'GitHub Actions 每天早上 5:00 (北京时间) 自动运行。',
              f'也可在 Actions 页面手动触发 `workflow_dispatch`。',
          ])
          Path('README.md').write_text('\n'.join(lines), encoding='utf-8')
          print(f'README updated: {len(nodes)} nodes')
          "

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ README.md
          git diff --staged --quiet || (
            git commit -m "🔄 Daily update $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          )
